<svg xmlns="http://www.w3.org/2000/svg" width="1181" height="768" viewBox="0 0 1181 768">
  <!-- Business Card Back: 100mm x 65mm at 300 DPI = 1181 x 768 px -->

  <defs>
    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="noisy"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#393e46" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Dark background -->
  <rect width="1181" height="768" fill="#22282e"/>

  <!-- Grid texture -->
  <rect width="1181" height="768" fill="url(#grid)"/>

  <!-- Corner accents (inverted - white/tertiary) -->
  <!-- Top-left -->
  <rect x="36" y="36" width="80" height="9" fill="#6b6358"/>
  <rect x="36" y="36" width="9" height="80" fill="#6b6358"/>

  <!-- Top-right -->
  <rect x="1065" y="36" width="80" height="9" fill="#6b6358"/>
  <rect x="1136" y="36" width="9" height="80" fill="#6b6358"/>

  <!-- Bottom-left -->
  <rect x="36" y="723" width="80" height="9" fill="#6b6358"/>
  <rect x="36" y="653" width="9" height="80" fill="#6b6358"/>

  <!-- Bottom-right -->
  <rect x="1065" y="723" width="80" height="9" fill="#6b6358"/>
  <rect x="1136" y="653" width="9" height="80" fill="#6b6358"/>

  <!-- Central monogram with brutalist treatment -->
  <g transform="translate(590, 384)">
    <!-- Large shadow offset -->
    <text x="12" y="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="280" font-weight="900" fill="#6b6358" text-anchor="middle" dominant-baseline="middle" letter-spacing="-20" opacity="0.25">LH</text>
    
    <!-- Main monogram -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-20">LH</text>
  </g>

  <!-- Horizontal accent lines -->
  <rect x="200" y="180" width="781" height="4" fill="#6b6358" opacity="0.5"/>
  <rect x="200" y="584" width="781" height="4" fill="#6b6358" opacity="0.5"/>

  <!-- Website at bottom -->
  <text x="590" y="680" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="18" font-weight="600" fill="#6b6358" text-anchor="middle" letter-spacing="4">LUKEHALLEY.COM</text>

  <!-- Decorative squares in corners of inner area -->
  <g transform="translate(200, 200)">
    <rect x="0" y="0" width="16" height="16" fill="#6b6358"/>
  </g>
  <g transform="translate(965, 200)">
    <rect x="0" y="0" width="16" height="16" fill="#6b6358"/>
  </g>
  <g transform="translate(200, 552)">
    <rect x="0" y="0" width="16" height="16" fill="#6b6358"/>
  </g>
  <g transform="translate(965, 552)">
    <rect x="0" y="0" width="16" height="16" fill="#6b6358"/>
  </g>

  <!-- Subtle noise overlay -->
  <rect width="1181" height="768" fill="#ffffff" filter="url(#noise)" opacity="0.02"/>
</svg>
