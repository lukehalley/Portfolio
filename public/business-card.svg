<svg xmlns="http://www.w3.org/2000/svg" width="1181" height="768" viewBox="0 0 1181 768">
  <!-- Business Card: 100mm x 65mm at 300 DPI = 1181 x 768 px -->

  <defs>
    <!-- Noise texture for brutalist feel -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="noisy"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>

    <!-- Grid pattern for background texture -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22282e" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1181" height="768" fill="#ffffff"/>

  <!-- Subtle grid texture -->
  <rect width="1181" height="768" fill="url(#grid)"/>

  <!-- === CORNER ACCENTS === -->
  <!-- Top-left L-bracket -->
  <rect x="36" y="36" width="80" height="9" fill="#6b6358"/>
  <rect x="36" y="36" width="9" height="80" fill="#6b6358"/>

  <!-- Bottom-right L-bracket -->
  <rect x="1065" y="723" width="80" height="9" fill="#6b6358"/>
  <rect x="1136" y="643" width="9" height="80" fill="#6b6358"/>

  <!-- === LEFT SIDE: NAME BLOCK === -->
  <g transform="translate(90, 130)">
    <!-- Name with offset shadow -->
    <!-- Shadow layer -->
    <text x="7" y="86" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="100" font-weight="900" fill="#6b6358" letter-spacing="-6" opacity="0.35">LUKE</text>
    <text x="7" y="196" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="100" font-weight="900" fill="#6b6358" letter-spacing="-6" opacity="0.35">HALLEY</text>

    <!-- Main text layer -->
    <text x="0" y="80" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="100" font-weight="900" fill="#22282e" letter-spacing="-6">LUKE</text>
    <text x="0" y="190" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="100" font-weight="900" fill="#22282e" letter-spacing="-6">HALLEY</text>

    <!-- Title block with heavy border -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="340" height="50" fill="none" stroke="#22282e" stroke-width="6"/>
      <text x="170" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="17" font-weight="700" fill="#393e46" text-anchor="middle" letter-spacing="4">CLOUD DEVELOPER</text>
    </g>

    <!-- Contact details -->
    <g transform="translate(0, 325)">
      <!-- Bigger lukehalley.com -->
      <text x="0" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="32" font-weight="700" fill="#22282e">lukehalley.com</text>
      <text x="0" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="18" font-weight="500" fill="#22282e">contact@lukehalley.com</text>
      <text x="0" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="18" font-weight="500" fill="#393e46">github.com/lukehalley</text>

      <!-- Location with pin indicator -->
      <circle cx="9" cy="146" r="6" fill="#6b6358"/>
      <text x="25" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="16" font-weight="600" fill="#6b6358" letter-spacing="1">PERTH, AUSTRALIA</text>
    </g>
  </g>

  <!-- === RIGHT SIDE: BRUTALIST PANEL === -->
  <g transform="translate(700, 130)">
    <!-- Hard shadow offset -->
    <rect x="11" y="11" width="360" height="508" fill="#6b6358" opacity="0.4"/>

    <!-- Main dark panel -->
    <rect x="0" y="0" width="360" height="508" fill="#22282e"/>

    <!-- Heavy border frame -->
    <rect x="0" y="0" width="360" height="508" fill="none" stroke="#22282e" stroke-width="9"/>

    <!-- Inner accent frame -->
    <rect x="22" y="22" width="316" height="464" fill="none" stroke="#393e46" stroke-width="1"/>

    <!-- Corner bracket accents inside panel -->
    <rect x="22" y="22" width="45" height="5" fill="#6b6358"/>
    <rect x="22" y="22" width="5" height="45" fill="#6b6358"/>
    <rect x="293" y="481" width="45" height="5" fill="#6b6358"/>
    <rect x="333" y="436" width="5" height="45" fill="#6b6358"/>

    <!-- Content centered and distributed evenly -->
    <!-- Tagline: centered at top third -->
    <text x="180" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="3">MULTI-CLOUD</text>
    <text x="180" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="3">INFRASTRUCTURE</text>
    <text x="180" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="3">AT SCALE</text>

    <!-- Horizontal rule: centered -->
    <rect x="65" y="250" width="230" height="4" fill="#ffffff"/>

    <!-- Experience stat: smaller and closer together -->
    <text x="182" y="330" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="50" font-weight="900" fill="#6b6358" text-anchor="middle" opacity="0.3">13+</text>
    <text x="180" y="328" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="50" font-weight="900" fill="#ffffff" text-anchor="middle">13+</text>
    <text x="180" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="3">YEARS EXPERIENCE</text>

    <!-- Decorative geometric element -->
    <g transform="translate(180, 440)">
      <rect x="-56" y="0" width="18" height="18" fill="none" stroke="#6b6358" stroke-width="2"/>
      <rect x="-9" y="0" width="18" height="18" fill="#6b6358"/>
      <rect x="38" y="0" width="18" height="18" fill="none" stroke="#6b6358" stroke-width="2"/>
    </g>
  </g>

  <!-- Subtle noise overlay for texture -->
  <rect width="1181" height="768" fill="#22282e" filter="url(#noise)" opacity="0.03"/>
</svg>
